<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket Spreeder — Simulator</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #1a1a1a;
        color: #ccc;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 40px 0;
    }
    .simulator {
        display: flex;
        gap: 40px;
        align-items: center;
    }
    .display-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }
    #display {
        border: 2px solid #333;
        border-radius: 4px;
        image-rendering: pixelated;
        width: 1072px;
        height: 480px;
    }
    .status {
        font-size: 14px;
        color: #888;
        text-align: center;
    }
    .status span { color: #ccc; }
    .encoder {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }
    .encoder-label {
        font-size: 12px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .knob-container {
        width: 80px;
        height: 80px;
        position: relative;
    }
    .knob {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #555, #2a2a2a);
        border: 2px solid #444;
        position: relative;
        transition: transform 0.1s ease-out;
    }
    .knob.pressed {
        background: radial-gradient(circle at 35% 35%, #666, #333);
        border-color: #888;
    }
    .knob-notch {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 12px;
        background: #888;
        border-radius: 2px;
    }
    .encoder-hint {
        font-size: 11px;
        color: #555;
        text-align: center;
    }
    .text-loader {
        display: flex;
        gap: 16px;
        margin-top: 32px;
        width: 1072px;
    }
    .drop-zone {
        flex: 1;
        border: 2px dashed #444;
        border-radius: 8px;
        padding: 24px;
        text-align: center;
        color: #666;
        font-size: 14px;
        cursor: pointer;
        transition: border-color 0.15s, color 0.15s;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 120px;
    }
    .drop-zone.drag-over {
        border-color: #888;
        color: #ccc;
        background: rgba(255,255,255,0.03);
    }
    .drop-zone input[type="file"] { display: none; }
    .text-input-area {
        flex: 2;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .text-input-area textarea {
        background: #222;
        color: #ccc;
        border: 2px solid #444;
        border-radius: 8px;
        padding: 12px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        resize: vertical;
        min-height: 120px;
        outline: none;
    }
    .text-input-area textarea:focus { border-color: #666; }
    .text-input-area button {
        align-self: flex-end;
        background: #333;
        color: #ccc;
        border: 1px solid #555;
        border-radius: 6px;
        padding: 8px 20px;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s;
    }
    .text-input-area button:hover { background: #444; }
</style>
</head>
<body>
<div class="simulator">
    <div class="display-wrapper">
        <canvas id="display" width="536" height="240"></canvas>
        <div class="status">
            <span id="wpm">300</span> WPM &nbsp;|&nbsp;
            <span id="state">Paused</span>
        </div>
    </div>
    <div class="encoder">
        <div class="encoder-label">Encoder</div>
        <div class="knob-container">
            <div class="knob" id="knob">
                <div class="knob-notch"></div>
            </div>
        </div>
        <div class="encoder-hint">
            ↑↓ or scroll: rotate<br>
            space: press
        </div>
    </div>
</div>
<div class="text-loader">
    <div class="drop-zone" id="drop-zone">
        <span>Drop a .txt file here<br>or click to browse</span>
        <input type="file" id="file-input" accept=".txt,text/plain">
    </div>
    <div class="text-input-area">
        <textarea id="text-input" placeholder="Or paste / type text here..."></textarea>
        <button id="load-text-btn">Load Text</button>
    </div>
</div>

<script>
    var Module = {
        canvas: document.getElementById('display'),
        onRuntimeInitialized: function() {
            console.log('Pocket Spreeder WASM loaded');
        }
    };
</script>
{{{ SCRIPT }}}
<script src="shell.js"></script>
</body>
</html>
